name: originflow-ci

# 设计说明 (T-224 修订版 v3, CEO 实测后重写):
#
# 关键事实 (2026-11-03 实测):
#   * OriginForce / AgentSwarm / ZenSwarm 三个 sibling 仓在 GitHub 上均为 PRIVATE,
#     GITHUB_TOKEN 跨仓无权 clone (CI 首跑即 "could not read Username for github.com").
#     故 full-chain job 需要 SIBLING_REPOS_TOKEN secret (PAT, repo scope) 才能跑。
#   * 本仓 sync/drift 依赖上述 sibling 仓 + 用户级 ~/.zcode 状态, 不是自包含的。
#   * 无 sibling 时自包含子集可跑: pytest 50 passed / 4 skipped rc=0,
#     gen_site --force --only index rc=0 且产物含「席位」。
#
# 因此分两个 job:
#   self-contained (必跑, 永远不需要 secret): 语法/YAML/测试/站点生成
#   full-chain     (需要 SIBLING_REPOS_TOKEN): 四仓 sibling → zcode 生成 → sync → drift → guard
#   未配置 secret 时 full-chain 自动 skip 并打印提示, 不算失败。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: originflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══ 自包含校验: 零外部依赖, 任何 fork/PR 都能跑 ═══════════════════════
  self-contained:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml pytest

      # workflow 自身语法: PyYAML 解析 + 关键步骤存在性
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import yaml, sys
          p = ".github/workflows/originflow-ci.yml"
          d = yaml.safe_load(open(p, encoding="utf-8"))
          assert "jobs" in d, "workflow 缺 jobs"
          steps = d["jobs"]["self-contained"]["steps"]
          names = [s.get("name", "") for s in steps]
          assert any("Unit tests" in n for n in names), "缺测试步骤"
          print(f"OK: workflow YAML 可解析, self-contained {len(steps)} steps")
          PY

      # 单元测试: 无 sibling 时 4 条依赖外部仓的用例自动 skip
      - name: Unit tests
        run: python -m pytest tests/ -q --no-header

      # 站点生成: 生成 index 并验证内容 (T-217 起的 --force 门禁)
      - name: Build site index
        run: python scripts/gen_site.py --force --only index

      - name: Verify index output
        run: |
          test -f site/index.html
          grep -q '席位' site/index.html
          echo "OK: site/index.html 存在且含「席位」"

  # ═══ 全链校验: 需要 SIBLING_REPOS_TOKEN (私有 sibling 仓 PAT) ══════════
  # 注意: GitHub 不允许 secrets 出现在 job 级 if (仅 github/needs/vars/inputs),
  # 故用首个 step 探测 token 并输出 enabled, 后续 step 按 outputs 门禁;
  # 未配置时 runner 只消耗 ~2s, 不算失败。
  full-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sibling token
        id: tok
        env:
          TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: 未配置 SIBLING_REPOS_TOKEN (三 sibling 仓为 PRIVATE), 全链校验跳过"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout OriginFlow
        if: steps.tok.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: OriginFlow

      - name: Setup Python 3.11
        if: steps.tok.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.tok.outputs.enabled == 'true'
        run: pip install pyyaml pytest

      # 三 sibling 仓均为私有: 用 PAT clone 到 sibling 位置 (布局是硬约束)
      - name: Clone sibling repos
        if: steps.tok.outputs.enabled == 'true'
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          CLONE_BASE="https://x-access-token:${SIBLING_TOKEN}@github.com/${{ github.repository_owner }}"
          git clone --depth 1 "$CLONE_BASE/originforce.git" OriginForce
          git clone --depth 1 -b develop "$CLONE_BASE/AgentSwarm.git" AgentSwarm
          git clone --depth 1 -b main "$CLONE_BASE/ZenSwarm.git" ZenSwarm
          echo "--- sibling layout ---"
          ls -d OriginForce AgentSwarm ZenSwarm OriginFlow

      # 干净 runner 无用户级 ~/.zcode, 缺则 sync 报 ERROR 20+
      - name: Seed ~/.zcode routing table
        if: steps.tok.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.zcode"
          printf '# ROUTING\n\n<!-- BEGIN generated:roster schema_content_hash=ci-seed -->\n<!-- END generated:roster -->\n' > "$HOME/.zcode/ROUTING_TABLE.md"

      # 必须在 drift 之前: drift 检查 ~/.zcode/agents/<seat>.md 是否存在
      - name: Generate zcode registrations
        if: steps.tok.outputs.enabled == 'true'
        working-directory: AgentSwarm
        run: python scripts/sync_agents_to_zcode_subagents.py

      - name: Sync team schema projections
        if: steps.tok.outputs.enabled == 'true'
        working-directory: OriginFlow
        run: python scripts/sync_team_schema.py --force

      # 末行输出「成员 N | binding N | ERROR N | WARN N」, 有 ERROR 时脚本 exit 1
      # 直接看退出码, 不接管道吞码
      - name: Drift check (must be ERROR 0)
        if: steps.tok.outputs.enabled == 'true'
        working-directory: OriginFlow
        run: python scripts/check_team_drift.py

      - name: Projection guard
        if: steps.tok.outputs.enabled == 'true'
        working-directory: OriginFlow
        run: python scripts/check_projection_guard.py

      - name: Full unit tests
        if: steps.tok.outputs.enabled == 'true'
        working-directory: OriginFlow
        run: python -m pytest tests/ -q --no-header
